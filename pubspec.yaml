name: qazan
description: "Qazan — sadiqlik və müştəri izləmə platforması. Loyalty & customer tracking platform."
publish_to: "none"
version: 1.0.0+8

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # QR codes

  # Media
  image_picker: ^1.1.2

  # Links (mailto / tel / whatsapp)
  url_launcher: ^6.3.1

  # Maps (OpenStreetMap tiles — no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Device location — used to show distance from the user to each place.
  geolocator: ^13.0.2

  # Phone number country-code picker (flags + dial codes).
  country_code_picker: ^3.1.0

  # Native share sheet (system "Share via..." dialog)
  share_plus: ^10.1.4

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0

  # Networking
  dio: ^5.7.0
  shared_preferences: ^2.3.4
  flutter_cache_manager: ^3.4.5
  nfc_manager: ^4.2.1
  ndef_record: ^1.4.2

  # Charts in the business and admin panels
  fl_chart: ^1.0.0

  # Native sign-in (Android / iOS only, guarded at runtime)
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^7.0.1

  # Phone notifications (FCM). Inert until Firebase is configured, see
  # PUSH_SETUP.md; never used on web or Windows.
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

# Native launch screen (shown before Flutter boots) — the pot-of-gold logo
# tile on brand orange (mid-tone of the Flutter splash gradient).
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F68328"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#F68328"
    image: assets/branding/splash_logo_android12.png
  web: false

# App launcher icons — regenerate with:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "assets/branding/app_icon_bg.png"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#F68328"
    theme_color: "#F68328"
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/illustrations/
    # Bundled Inter fonts — used by google_fonts offline (no gstatic).
    - assets/google_fonts/
