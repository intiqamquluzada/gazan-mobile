name: qazan
description: "Qazan — sadiqlik və müştəri izləmə platforması. Loyalty & customer tracking platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # QR codes
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Media
  image_picker: ^1.1.2

  # Links (mailto / tel / whatsapp)
  url_launcher: ^6.3.1

  # Maps (OpenStreetMap tiles — no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Device location — used to show distance from the user to each place.
  geolocator: ^13.0.2

  # Phone number country-code picker (flags + dial codes).
  country_code_picker: ^3.1.0

  # Native share sheet (system "Share via..." dialog)
  share_plus: ^10.1.4

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0

  # Networking
  dio: ^5.7.0
  shared_preferences: ^2.3.4

  # Push notifications (FCM) are temporarily disabled — Firebase isn't
  # configured yet (no google-services.json). PushService is a no-op
  # until then. Re-add firebase_core / firebase_messaging + config files
  # to switch it back on (see PUSH_SETUP.md).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

# Native launch screen (shown before Flutter boots) — brand purple + white Q.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#6C2BD9"
  image: assets/branding/app_icon_foreground.png
  android_12:
    color: "#6C2BD9"
    image: assets/branding/app_icon_foreground.png
  web: false

# App launcher icons — regenerate with:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "assets/branding/app_icon_bg.png"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#6C2BD9"
    theme_color: "#6C2BD9"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    # Bundled Inter fonts — used by google_fonts offline (no gstatic).
    - assets/google_fonts/
